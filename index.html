<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>China Parts Gallery</title>
  <style>
body {
    background: linear-gradient(135deg, #ffb6c1, #ffc0cb, #ffe4e1);
    font-family: 'Poppins', sans-serif;
    text-align: center;
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    max-width: 400px;
}

h1 {
    margin-bottom: 10px;
}

.buttons {
    margin-top: 20px;
}

button {
    padding: 12px 25px;
    margin: 10px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
}

#yes {
    background-color: #ff69b4;
    color: white;
}

#yes:hover {
    background-color: #ff85c1;
}

#no {
    background-color: #808080;
    color: white;
    position: relative;
}

#message {
    font-size: 20px;
    margin-top: 20px;
    color: #ff1493;
    font-weight: bold;
}

  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header>
    <img src="Images/ChinaPartLogo.jpg" alt="China Parts Logo">
  </header>

  <div class="gallery">
    <!-- Images will be generated by script -->
  </div>

  <a href="https://wa.me/9647869183438" class="whatsapp-btn" target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const gallery = document.querySelector('.gallery');
      const folder = '.';
      const startIndex = 1;
      const endIndex = 104;
      const extension = 'png';
      const batchSize = 12; // Number of images to load per scroll
      let currentIndex = startIndex;
      let loading = false;

      function loadImages() {
        if (loading) return;
        loading = true;
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < batchSize && currentIndex <= endIndex; i++, currentIndex++) {
          const src = `${folder}/${currentIndex}.${extension}`;
          const img = document.createElement('img');
          img.src = src;
          img.alt = `Part ${currentIndex}`;
          img.loading = 'lazy';
          img.onerror = () => img.remove();
          fragment.appendChild(img);
        }
        gallery.appendChild(fragment);
        loading = false;
      }

      // Initial load
      loadImages();

      // Load more images as user scrolls near the bottom
      window.addEventListener('scroll', () => {
        if ((window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 300)) {
          loadImages();
        }
      });
    });
  </script>

</body>
</html>
